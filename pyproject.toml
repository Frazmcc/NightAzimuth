[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightazimuth"
version = "1.1.0-rc1"
description = "Location-based live satellite tracking with directional sky identification and observing guidance."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Logic Lurker" }]
dependencies = [
  "httpx>=0.27,<1",
  "pandas>=2.2,<4",
  "pillow>=10,<13",
  "skyfield>=1.55,<2",
  "timezonefinder>=6.5,<10",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pyinstaller>=6,<7", "pytest", "ruff", "fastapi>=0.115,<1"]

[project.scripts]
nightazimuth = "nightazimuth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
