[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightazimuth"
version = "0.1.0.dev0"
description = "Location-based live satellite tracking with directional sky identification and near-real-time cloud awareness."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Frazmcc" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
