[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightazimuth"
version = "0.2.0a1"
description = "Location-based live satellite tracking with directional sky identification and observing guidance."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Logic Lurker" }
]
dependencies = [
  "httpx>=0.27,<1",
  "pandas>=2.2,<4",
  "pillow>=10,<13",
  "skyfield>=1.55,<2",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6,<7",
  "pytest",
  "ruff"
]

[project.scripts]
nightazimuth = "nightazimuth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
