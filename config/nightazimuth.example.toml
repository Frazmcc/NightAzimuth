# NightAzimuth example configuration
#
# Copy this file to a local, untracked configuration file when runtime
# configuration is introduced. Do not commit API keys or other secrets.

[observer]
# Decimal degrees. Positive latitude = north, negative = south.
latitude = 0.0
# Decimal degrees. Positive longitude = east, negative = west.
longitude = 0.0
# Observer altitude above mean sea level in metres.
altitude_m = 0.0

[tracking]
# Minimum elevation above the local horizon to include in results.
minimum_elevation_deg = 0.0
# Reserved for later live-refresh work.
position_refresh_seconds = 1.0

[data]
# CelesTrak GP group. ACTIVE is the broad default catalogue for Stage 3.
celestrak_group = "ACTIVE"
# Cache orbital data locally to avoid unnecessary repeated downloads.
cache_directory = "data/cache"
cache_max_age_minutes = 120

[weather]
# Weather/cloud provider selection will be implemented in a later approved stage.
enabled = false
