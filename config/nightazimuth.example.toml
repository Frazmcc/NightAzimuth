# NightAzimuth example configuration
#
# Copy this file to a local, untracked configuration file when runtime
# configuration is introduced. Do not commit API keys or other secrets.

[observer]
# Decimal degrees. Positive latitude = north, negative = south.
latitude = 0.0
# Decimal degrees. Positive longitude = east, negative = west.
longitude = 0.0
# Observer altitude above mean sea level in metres.
altitude_m = 0.0

[tracking]
# Minimum elevation above the local horizon to include in the live list.
minimum_elevation_deg = 0.0
# Minimum elevation a predicted pass must reach to be listed.
pass_minimum_elevation_deg = 10.0
# How far ahead to predict satellite passes.
pass_prediction_hours = 24.0
# Sun altitude at or below which NightAzimuth considers the local sky dark.
# -6 = civil twilight, -12 = nautical twilight, -18 = astronomical twilight.
darkness_threshold_deg = -6.0

[data]
# CelesTrak GP group to load. VISUAL is the curated "100 (or so) Brightest"
# group and is the best default for visual-satellite tracking.
celestrak_group = "VISUAL"
cache_directory = "data/cache"
# Refresh GP orbital data after this many minutes.
cache_max_age_minutes = 120

[weather]
# Weather/cloud provider selection will be designed in a later approved stage.
enabled = false
