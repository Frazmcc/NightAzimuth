services:
  - type: web
    name: nightazimuth-api
    runtime: python
    plan: free
    buildCommand: pip install ".[api]" && python -m nightazimuth.preload_sky && python -m nightazimuth.preload_satellites
    startCommand: uvicorn nightazimuth.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NIGHTAZIMUTH_PREWARM_SKY
        value: "1"
