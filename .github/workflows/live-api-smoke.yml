name: Live API smoke probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-api-smoke.yml"
      - "render.yaml"
      - "src/nightazimuth/api.py"
      - "src/nightazimuth/api_aircraft.py"
      - "src/nightazimuth/aircraft_adsb_lol.py"
      - "src/nightazimuth/api_airports.py"
      - "src/nightazimuth/api_weather.py"
      - "src/nightazimuth/api_observing.py"
      - "src/nightazimuth/observing_planner.py"
      - "src/nightazimuth/weather.py"
      - "src/nightazimuth/weather_snapshot_cache.py"
      - "src/nightazimuth/stage20_rc_airports.py"
      - "src/nightazimuth/preload_airports.py"
      - "src/nightazimuth/api_sky.py"
      - "src/nightazimuth/api_satellites.py"
      - "src/nightazimuth/api_satellites_cached.py"
      - "src/nightazimuth/burst_cache.py"
      - "src/nightazimuth/celestrak.py"
      - "src/nightazimuth/preload_sky.py"
      - "src/nightazimuth/preload_satellites.py"
      - "src/nightazimuth/star_field.py"
      - "src/nightazimuth/tracker.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-api-smoke
  cancel-in-progress: true

jobs:
  probe:
    name: Probe production API
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      API_BASE: https://api.nightazimuth.co.uk
      # Fixed public test location near the Royal Observatory, Greenwich.
      # Never use a user's saved or current coordinates in CI logs.
      TEST_LATITUDE: "51.4769"
      TEST_LONGITUDE: "0.0005"

    steps:
      - name: Wait for exact production commit
        shell: bash
        run: |
          set -euo pipefail

          deployed=""
          for attempt in $(seq 1 40); do
            metrics="$(curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 5 \
              --max-time 12 \
              --output /tmp/health.json \
              --write-out '%{http_code} %{time_namelookup} %{time_connect} %{time_starttransfer} %{time_total} %{size_download}' \
              "$API_BASE/api/v1/health" || true)"

            read -r status dns connect ttfb total size <<<"${metrics:-0 0 0 0 0 0}"
            deployed=""
            if [[ "$status" == "200" ]]; then
              deployed="$(python - <<'PY' 2>/dev/null || true
          import json
          from pathlib import Path
          try:
              payload = json.loads(Path('/tmp/health.json').read_text(encoding='utf-8'))
              print(payload.get('git_commit', ''))
          except Exception:
              pass
          PY
              )"
            fi

            echo "Health attempt $attempt: HTTP=$status total=${total:-0}s deployed=${deployed:-unknown} expected=$GITHUB_SHA"

            if [[ "$status" == "200" && "$deployed" == "$GITHUB_SHA" ]]; then
              echo "Exact production commit is live."
              break
            fi

            if [[ "$attempt" -eq 40 ]]; then
              echo "Production did not expose expected commit $GITHUB_SHA within the probe window." >&2
              echo "Last observed commit: ${deployed:-unknown}" >&2
              exit 1
            fi
            sleep 10
          done

          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/health.json').read_text(encoding='utf-8'))
          if payload.get('status') != 'ok':
              raise SystemExit(f"Unexpected health payload: {payload!r}")
          print(f"Application version: {payload.get('application_version', 'unknown')}")
          print(f"Deployed commit: {payload.get('git_commit', 'unknown')}")
          PY

      - name: Measure standalone sky and burst-cache behavior
        shell: bash
        run: |
          set -euo pipefail

          sky_url="$API_BASE/api/v1/sky?latitude=$TEST_LATITUDE&longitude=$TEST_LONGITUDE&altitude_m=0"
          : > /tmp/sky-samples.txt

          for sample in 1 2 3; do
            : > "/tmp/sky-${sample}-headers.txt"
            metrics="$(curl \
              --silent \
              --show-error \
              --location \
              --compressed \
              --connect-timeout 10 \
              --max-time 90 \
              --dump-header "/tmp/sky-${sample}-headers.txt" \
              --output "/tmp/sky-${sample}.json" \
              --write-out '%{http_code} %{time_namelookup} %{time_connect} %{time_starttransfer} %{time_total} %{size_download}' \
              "$sky_url")"

            read -r status dns connect ttfb total size <<<"$metrics"
            timing="$(awk 'BEGIN{IGNORECASE=1} /^server-timing:/ {sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' "/tmp/sky-${sample}-headers.txt")"

            if [[ "$status" != "200" ]]; then
              echo "Standalone sky sample $sample failed: HTTP=$status" >&2
              exit 1
            fi
            if [[ "$timing" != *"snapshot;dur="* && "$timing" != *'burst_cache;desc="hit"'* ]]; then
              echo "Standalone sky sample $sample lacks compute/cache timing: ${timing:-missing}" >&2
              exit 1
            fi

            echo "sample=$sample http=$status dns=${dns}s connect=${connect}s ttfb=${ttfb}s total=${total}s bytes=$size timing=$timing" | tee -a /tmp/sky-samples.txt
          done

          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/sky-3.json').read_text(encoding='utf-8'))
          required = ('stars', 'planets', 'galaxies', 'constellation_lines')
          for key in required:
              if not isinstance(payload.get(key), list):
                  raise SystemExit(f"Sky payload field {key!r} is missing or is not a list")
              print(f"{key}={len(payload[key])}")
          PY

      - name: Measure current Live Sky startup
        shell: bash
        run: |
          set -euo pipefail

          lat="$TEST_LATITUDE"
          lon="$TEST_LONGITUDE"
          aircraft_radius_km="80.4672"

          probe_endpoint() {
            local name="$1"
            local url="$2"
            : > "/tmp/${name}.headers"
            curl \
              --silent \
              --show-error \
              --location \
              --compressed \
              --connect-timeout 10 \
              --max-time 120 \
              --dump-header "/tmp/${name}.headers" \
              --output "/tmp/${name}.json" \
              --write-out '%{http_code} %{time_namelookup} %{time_connect} %{time_starttransfer} %{time_total} %{size_download}' \
              "$url" > "/tmp/${name}.metrics" 2> "/tmp/${name}.stderr" || true
          }

          # Current browser startup: lightweight/live requests begin immediately.
          # The two logical aircraft consumers share one 50-mile acquisition.
          probe_endpoint aircraft "$API_BASE/api/v1/aircraft?latitude=$lat&longitude=$lon&radius_km=$aircraft_radius_km&minimum_elevation_deg=-90&include_ground=false" & p1=$!
          probe_endpoint airports "$API_BASE/api/v1/airports?latitude=$lat&longitude=$lon&radius_km=160.934&limit=12" & p2=$!
          probe_endpoint weather "$API_BASE/api/v1/weather?latitude=$lat&longitude=$lon" & p3=$!
          probe_endpoint observing "$API_BASE/api/v1/observing?latitude=$lat&longitude=$lon" & p4=$!

          # Heavy astronomy work is progressive in the browser: sky first, then
          # satellites after sky completes plus a short spread/base delay.
          probe_endpoint sky "$API_BASE/api/v1/sky?latitude=$lat&longitude=$lon&altitude_m=0"
          sleep 0.25
          probe_endpoint satellites "$API_BASE/api/v1/satellites?latitude=$lat&longitude=$lon&minimum_elevation_deg=0"

          wait "$p1" "$p2" "$p3" "$p4"

          : > /tmp/startup-summary.txt
          for name in aircraft airports weather observing sky satellites; do
            metrics="$(cat "/tmp/${name}.metrics")"
            read -r status dns connect ttfb total size <<<"${metrics:-0 0 0 0 0 0}"
            echo "$name $status $dns $connect $ttfb $total $size" >> /tmp/startup-summary.txt
            if [[ "$status" != "200" ]]; then
              echo "$name failed: HTTP=$status" >&2
              cat "/tmp/${name}.stderr" >&2 || true
              exit 1
            fi
          done

          timing_for() {
            awk 'BEGIN{IGNORECASE=1} /^server-timing:/ {sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' "/tmp/$1.headers"
          }

          aircraft_timing="$(timing_for aircraft)"
          airports_timing="$(timing_for airports)"
          weather_timing="$(timing_for weather)"
          observing_timing="$(timing_for observing)"
          sky_timing="$(timing_for sky)"
          satellite_timing="$(timing_for satellites)"

          [[ "$aircraft_timing" == *"provider_request;dur="* ]] || { echo "Aircraft instrumentation missing" >&2; exit 1; }
          [[ "$airports_timing" == *"provider;dur="* ]] || { echo "Airport instrumentation missing" >&2; exit 1; }
          [[ "$weather_timing" == *"weather_load;dur="* ]] || { echo "Weather instrumentation missing" >&2; exit 1; }
          [[ "$observing_timing" == *"planner_build;dur="* ]] || { echo "Observing instrumentation missing" >&2; exit 1; }
          [[ "$sky_timing" == *"snapshot;dur="* || "$sky_timing" == *'burst_cache;desc="hit"'* ]] || { echo "Sky instrumentation missing" >&2; exit 1; }
          [[ "$satellite_timing" == *"propagate;dur="* || "$satellite_timing" == *'burst_cache;desc="hit"'* ]] || { echo "Satellite instrumentation missing" >&2; exit 1; }

          {
            echo "## NightAzimuth production API probe"
            echo ""
            echo "Deployed commit: \`$GITHUB_SHA\`"
            echo ""
            echo "### Sky samples"
            echo '```text'
            cat /tmp/sky-samples.txt
            echo '```'
            echo ""
            echo "### Current six-request Live Sky startup"
            echo "| Endpoint | HTTP | DNS | Connect | TTFB | Total | Bytes |"
            echo "| --- | ---: | ---: | ---: | ---: | ---: | ---: |"
            while read -r name status dns connect ttfb total size; do
              echo "| $name | $status | ${dns}s | ${connect}s | ${ttfb}s | ${total}s | $size |"
            done < /tmp/startup-summary.txt
            echo ""
            echo "Sky Server-Timing: \`$sky_timing\`"
            echo ""
            echo "Satellite Server-Timing: \`$satellite_timing\`"
            echo ""
            echo "Fixed test coordinates: Royal Observatory, Greenwich (public test location)."
          } >> "$GITHUB_STEP_SUMMARY"
