name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff correctness checks
        run: python -m ruff check --select E4,E7,E9,F src tests nightazimuth_launcher.py nightazimuth_gui_launcher.py

      - name: Pytest
        run: python -m pytest -q

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name NightAzimuth --collect-data skyfield nightazimuth_gui_launcher.py
          if (-not (Test-Path .\dist\NightAzimuth.exe)) {
            throw "NightAzimuth.exe was not produced"
          }
