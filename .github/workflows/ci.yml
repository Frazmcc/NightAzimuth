name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff correctness checks
        run: python -m ruff check --select E4,E7,E9,F src tests nightazimuth_launcher.py nightazimuth_gui_launcher.py

      - name: Validate hosted JavaScript syntax
        run: node --check web/app.js

      - name: Hosted DOM contract smoke test
        shell: pwsh
        run: |
          $html = Get-Content web/index.html -Raw
          $js = Get-Content web/app.js -Raw
          $ids = [regex]::Matches($js, 'querySelector\("#([^"]+)"\)') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          foreach ($id in $ids) {
            if ($html -notmatch ('id="' + [regex]::Escape($id) + '"')) { throw "web/app.js references missing DOM id: $id" }
          }
          if ($js.Contains('\nfunction')) { throw "web/app.js contains a literal escaped newline before function" }

      - name: Pytest
        run: python -m pytest -q

      - name: Build Windows release output
        shell: pwsh
        run: |
          .\build_windows.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Windows build failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path .\dist\NightAzimuth.exe)) {
            throw "NightAzimuth.exe was not produced"
          }
          if (-not (Test-Path .\dist\NightAzimuth_User_Guide.md)) {
            throw "NightAzimuth user guide was not included in the release output"
          }
