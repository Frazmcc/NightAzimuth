name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src tests nightazimuth_launcher.py nightazimuth_gui_launcher.py

      - name: Ruff correctness checks
        run: python -m ruff check --select E4,E7,E9,F src tests nightazimuth_launcher.py nightazimuth_gui_launcher.py

      - name: Validate all hosted JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem .\web -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "JavaScript syntax check failed: $($_.Name)"
            }
          }

      - name: Hosted DOM contract smoke test
        shell: pwsh
        run: |
          $html = Get-Content web/index.html -Raw
          Get-ChildItem .\web -Filter *.js | ForEach-Object {
            $js = Get-Content $_.FullName -Raw
            $ids = [regex]::Matches($js, 'querySelector\("#([^"]+)"\)') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
            foreach ($id in $ids) {
              $htmlHasId = $html -match ('id="' + [regex]::Escape($id) + '"')
              $createdPattern = '\.id\s*=\s*["'']' + [regex]::Escape($id) + '["'']'
              $scriptCreatesId = $js -match $createdPattern
              if (-not $htmlHasId -and -not $scriptCreatesId) {
                throw "$($_.Name) references missing DOM id: $id"
              }
            }
            if ($js.Contains('\nfunction')) {
              throw "$($_.Name) contains a literal escaped newline before function"
            }
          }

      - name: Pytest
        run: python -m pytest -q

      - name: Build Windows release output
        shell: pwsh
        run: |
          .\build_windows.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Windows build failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path .\dist\NightAzimuth.exe)) {
            throw "NightAzimuth.exe was not produced"
          }
          if (-not (Test-Path .\dist\NightAzimuth_User_Guide.md)) {
            throw "NightAzimuth user guide was not included in the release output"
          }
