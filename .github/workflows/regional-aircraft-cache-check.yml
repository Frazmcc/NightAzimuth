name: Regional aircraft cache verification

on:
  push:
    branches:
      - task-6-regional-aircraft-cache
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[api]'
      - name: Run regional cache tests
        run: pytest -q tests/test_aircraft_regional_cache.py tests/test_api_aircraft.py tests/test_aircraft_snapshot_cache.py tests/test_aircraft_adsb_lol.py
